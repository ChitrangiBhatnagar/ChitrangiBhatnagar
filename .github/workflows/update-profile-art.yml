name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the job can push the refreshed cards.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "requests==2.32.3" \
            "beautifulsoup4==4.12.3" \
            "fonttools>=4.56.0" \
            "brotli>=1.1.0" \
            "pillow>=10.0.0"

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render SVG cards
        run: python scripts/render_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/*.svg
          if git diff --staged --quiet; then
            echo "No card changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh profile cards [skip ci]"
          git push
