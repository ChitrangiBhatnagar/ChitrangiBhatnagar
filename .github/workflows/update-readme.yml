name: Auto-update README

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: readme-updates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Requires no custom secrets — uses the built-in GITHUB_TOKEN.
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          # This action reads process.env.GITHUB_TOKEN (not GH_TOKEN).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 5
          COMMIT_MSG: 'chore: update recent activity [skip ci]'

  # Requires repo secret WAKATIME_API_KEY (https://wakatime.com/settings/api-key).
  # Runs after activity to avoid racing README commits.
  update-waka:
    runs-on: ubuntu-latest
    needs: update-activity
    # Soft-fail until WakaTime is connected — don't red the whole workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Update WakaTime stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # Profile README can commit with the job token; no GH_TOKEN secret needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: true
          SHOW_TOTAL: true
          COMMIT_MESSAGE: 'chore: update waka stats [skip ci]'
