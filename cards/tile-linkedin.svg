<svg xmlns="http://www.w3.org/2000/svg" width="280" height="120" viewBox="0 0 280 120" role="img" aria-label="LinkedIn">
  <style>
@font-face{font-family:'Space Grotesk';font-weight:400;font-style:normal;src:url('data:font/woff;base64,') format('woff');}
@font-face{font-family:'Space Grotesk';font-weight:500;font-style:normal;src:url('data:font/woff;base64,') format('woff');}
@font-face{font-family:'Space Grotesk';font-weight:700;font-style:normal;src:url('data:font/woff;base64,') format('woff');}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;src:url('data:font/woff;base64,') format('woff');}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-style:normal;src:url('data:font/woff;base64,') format('woff');}
.in{opacity:1;transform:none}.bar{transform:none}.cell{opacity:1}
.pulse{opacity:.75}
@media (prefers-reduced-motion:no-preference){
  .in{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.23,1,.32,1) forwards}
  .bar{transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.23,1,.32,1) forwards}
  .cell{opacity:0;animation:fade .45s ease forwards}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .in,.bar,.cell,.pulse{animation:none!important;opacity:1!important;transform:none!important}
}
.t{font-family:'Space Grotesk',sans-serif}.m{font-family:'JetBrains Mono',monospace}
</style>
  <rect width="280" height="120" rx="16" fill="#1A1D24"/>
  <rect x="1" y="1" width="278" height="118" rx="15" fill="none" stroke="#2C3340" stroke-width="1.5"/>
  <g class="in" style="animation-delay:0.45s">
    <circle cx="44" cy="60" r="22" fill="#22262F" stroke="#00BFFF" stroke-width="1.5"/>
    <text x="44" y="66" text-anchor="middle" fill="#00BFFF" font-size="16" font-weight="700" class="m">in</text>
    <text x="82" y="54" fill="#E6FFFF" font-size="18" font-weight="700" class="t">LinkedIn</text>
    <text x="82" y="78" fill="#9BA3AF" font-size="12" font-weight="400" class="m">connect / career</text>
  </g>
</svg>
